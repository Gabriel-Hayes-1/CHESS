<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Chess.steelseas</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="assets/pieces/wp.svg" media="(prefers-color-scheme: dark)">
    <link rel="icon" href="assets/pieces/bp.svg" media="(prefers-color-scheme: light)">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <div id="app">
        <div id="sidebar">
            <h1 id="app-title">Chess.steelseas</h1>
            <button data-page="play" class="sidebar-btn">Play</button>
            <button data-page="settings"class="sidebar-btn">Settings</button>
            <button data-page="account" class="sidebar-btn">Account</button>
        </div>
        <button id="sidebar-toggle"></button>
        <div id="page-content-container">
            <div id="loading" class="page active">
                <div class="loading-dots-wrap">
                    <div class="loading-dots">
                    <span></span><span></span><span></span>
                    </div>
                </div>
            </div>
            <div id="play" class="page">
                <div id="play-container">

                    <div id="board-container">
                        <div id="promotion-select" class="transparent">
                            <img id="promotion-queen" src="" alt="Queen">
                            <img id="promotion-rook" src="" alt="Rook">
                            <img id="promotion-bishop" src="" alt="Bishop">
                            <img id="promotion-knight" src="" alt="Knight">
                        </div>
                        <canvas id="board">Canvas is not supported!</canvas>
                    </div>
                    
                    <div id="game-card">
                        <div id="not-in-game" class="card-page active">
                            <h1>Play Chess</h1>
                            <div id="gamemode-select">

                            </div>
                            <button id="find-game" class="page-btn">Find Game</button>
                            <button id="cancel-find-game" class="page-btn hidden">Cancel</button>
                            <div id="matchmaking-feedback"></div>
                        </div>
                        <div id="in-game" class="card-page">
                        
                            <div class="player-row" id="opponent-row">
                                <div class="player-avatar">
                                    <img id="opponent-avatar" src="" alt="Opponent" />
                                    <span class="avatar-placeholder" id="opponent-avatar-placeholder">?</span>
                                </div>
                                <div class="player-info">
                                    <span class="player-name" id="opponent-username">Opponent</span>
                                    <span class="player-elo">ELO <span id="opponent-elo">—</span></span>
                                </div>
                                <div class="player-clock" id="opponent-clock">10:00</div>
                            </div>
                        
                            <div id="move-history">
                                <div id="move-history-label">Moves</div>
                                <div id="move-list">
                                    <!-- JS populates: <span class="move-num">1</span><span class="move">e4</span><span class="move">e5</span> -->
                                </div>
                            </div>
                        
                            <div id="game-actions">
                                <div class="action-label hidden" id="action-confirm-label"></div>
                                <div class="action-label hidden" id="draw-offer-label"></div>
                                <div class="game-actions-row hidden" id="draw-offer-actions">
                                    <button class="action-btn" id="draw-accept">Accept</button>
                                    <button class="action-btn" id="draw-deny">Deny</button>
                                </div>
                                <div class="game-actions-row">
                                    <button class="action-btn" id="offer-draw">Draw</button>
                                    <button class="action-btn danger" id="resign">Resign</button>
                                    <button class="action-btn hidden" id="action-confirm">Confirm</button>
                                    <button class="action-btn hidden" id="action-cancel">Cancel</button>
                                </div>
                                
                                <div class="action-gameover hidden" id="gameover">
                                    <span id="game-winner">-</span>
                                    <span id="game-win-reason-wrap">by <span id="game-win-reason">-</span></span>
                                </div>
                                <div class="game-actions-row hidden" id="game-end-actions">
                                    <button class="action-btn danger hidden" id="cancel-same-game">Cancel</button>
                                    <button class="action-btn good" id="new-same-game">New Game</button>
                                    <button class="action-btn" id="back-lobby">Back to Lobby</button>
                                </div>
                            </div>
                        
                            <div class="player-row" id="self-row">
                                <div class="player-avatar">
                                    <img id="self-avatar" src="" alt="You" />
                                    <span class="avatar-placeholder" id="self-avatar-placeholder">♟</span>
                                </div>
                                <div class="player-info">
                                    <span class="player-name" id="self-username">You</span>
                                    <span class="player-elo">ELO <span id="self-elo">—</span></span>
                                </div>
                                <div class="player-clock" id="self-clock">10:00</div>
                            </div>
                        
                        </div>
                    </div>
                </div>
            </div>

            <div id="settings" class="page">
                <div class="scroll">
                    <div class="setting">
                        <div class="setting-text">
                            <h1>Color</h1>
                            <p>The colors of the board</p>
                        </div>
                        <div class="setting-controls">
                            <div id="theme-select" class="colorpair">
                                <div class="color"></div>
                                <div class="color"></div>
                            </div>
                            <div id="theme-dropdown" class="hidden"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="account" class="page">
                <div class="scroll">
                    <div class="setting">
                        <div class="setting-text">
                            <h1>Account Info</h1>
                            <p id="loginStatus">You are not logged in.</p>
                        </div>
                        <div class="setting-controls">
                            
                        </div>
                    </div>
                    <div class="setting" id="login-setting">
                        <div class="setting-text">
                            <h1>Log in</h1>
                            <p>Log in, or sign up</p>
                        </div>
                        <div class="setting-controls">
                            <button class="page-btn" id="login">Log in</button>
                            <button class="page-btn signup" id="signup">Sign up</button>
                            <input type="password" class="setting-input-text" id="passwordInputConfirm" placeholder="Confirm Password">
                            <input type="password" class="setting-input-text" id="passwordInput" placeholder="Password">
                            <input type="text" class="setting-input-text" id="usernameInput" placeholder="Username">
                        </div>
                        <div class="setting-feedback hidden" id="login-feedback">
                            Passwords do not match
                        </div>
                    </div>
                    <div class="setting" id="logout-setting">
                        <div class="setting-text">
                            <h1>Log out</h1>
                            <p>Log out of your account</p>
                        </div>
                        <div class="setting-controls">
                            <button class="page-btn" id="logout">Log out</button>
                        </div>
                        <div class="setting-feedback hidden" id="logout-feedback">
                            Passwords do not match
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="settings.js"></script>
    <script type="module" src="auth.js"></script>
    <script type="module" src="ui.js"></script>
    <script type="module" src="chessclient.js"></script>
    <script type="module" src="main.js"></script>
</body>
</html>
